version = "2"

[run]
timeout = "120s"

[linters]
enable = [
    "gocyclo", "unconvert", "unused",
    "govet", "misspell", "nakedret", "errcheck", "revive", "ineffassign",
    # "goconst", # disabled: returning linter errors for constants in structs
    "unparam"
]

[formatters]
enable = ["goimports", "gofmt"]
