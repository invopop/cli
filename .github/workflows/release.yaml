#
# Automatically tag a merge to main and publish a GitHub release with
# cross-platform binaries via GoReleaser.
#
# Secrets required:
#  * `GITHUB_TOKEN` - provided automatically by GitHub Actions.
#  * `HOMEBREW_TAP_APP_KEY` - private key of the GitHub App installed on
#    invopop/homebrew-tap with contents write.
#
# Variables required:
#  * `HOMEBREW_TAP_APP_ID` - that GitHub App's ID. Optional; the Homebrew
#    formula is not published without it.
#

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag-build-publish:
    name: Tag & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0" # make sure we get all commits

      - name: Get repo details
        run: |
          echo "COMMIT_TYPE=$(echo $GITHUB_REF | cut -d / -f 2)" >> $GITHUB_ENV

      - name: Bump version and push tag
        id: bump
        if: env.COMMIT_TYPE != 'tags'
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: main
          WITH_V: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Create Homebrew tap token
        id: tap-token
        if: vars.HOMEBREW_TAP_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_KEY }}
          owner: invopop
          repositories: homebrew-tap

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2" # v3 may drop `brews`, used for the Homebrew formula
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
