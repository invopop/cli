name: Test Go
on: [push]
jobs:
  test-build:
    name: Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -v ./...
