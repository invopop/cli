version: 2
before:
  hooks:
    - go mod download
builds:
  - id: invopop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/invopop
    binary: invopop
archives:
  - id: invopop
    ids:
      - invopop
    formats:
      - tar.gz
    name_template: "invopop.{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: invopop
    name: cli
  prerelease: auto
