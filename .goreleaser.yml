version: 2
before:
  hooks:
    - go mod download
builds:
  - id: invopop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/invopop
    binary: invopop
archives:
  - id: invopop
    ids:
      - invopop
    formats:
      - tar.gz
    name_template: "invopop.{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats:
          - zip

# Publish a formula rather than a cask: Homebrew quarantines casks, so an
# unsigned binary installed as one is blocked by Gatekeeper, but formulas
# are not quarantined. `brews` is deprecated in favour of casks, so the
# release workflow pins GoReleaser to v2.
brews:
  - name: invopop
    ids:
      - invopop
    directory: Formula
    homepage: https://invopop.com
    description: Command-line interface for the Invopop platform
    repository:
      owner: invopop
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    install: |
      bin.install "invopop"
      generate_completions_from_executable(bin/"invopop", "completion")
    test: |
      system "#{bin}/invopop", "--help"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: invopop
    name: cli
  prerelease: auto
