version: 2
before:
  hooks:
    - go mod download
builds:
  - id: invopop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/invopop
    binary: invopop
archives:
  - id: invopop
    ids:
      - invopop
    formats:
      - tar.gz
    name_template: "invopop.{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats:
          - zip

# Sign and notarize the macOS binaries so Gatekeeper trusts them. Runs on
# the Linux runner (quill); skipped when the signing secrets are absent, as
# in snapshots and forks.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - invopop
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

homebrew_casks:
  - name: invopop
    ids:
      - invopop
    binaries:
      - invopop
    homepage: https://invopop.com
    description: Command-line interface for the Invopop platform
    repository:
      owner: invopop
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    generate_completions_from_executable:
      executable: invopop
      args:
        - completion
      shells:
        - bash
        - zsh
        - fish

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: invopop
    name: cli
  prerelease: auto
